apiVersion: 1

# Proveedor de dashboards: Grafana carga al arrancar todos los .json
# de esta carpeta (montada en /etc/grafana/provisioning/dashboards).
providers:
  - name: 'Dashboards Parcial COMM'
    orgId: 1
    folder: 'Parcial COMM'
    type: file
    disableDeletion: true
    updateIntervalSeconds: 30
    allowUiUpdates: false
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false
