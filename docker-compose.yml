name: parcial-redes-comunicaciones

networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge

volumes:
  postgres_data:
  joomla_data:
  nginx_logs:

services:

  # ----------------------------------------------------------------
  # 1. Edge Router / Reverse Proxy
  # ----------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    restart: unless-stopped
    ports:
      - "80:80"          # único contenedor con puerto publicado al host
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx_logs:/var/log/nginx
    networks:
      - frontend_net
    depends_on:
      joomla:
        condition: service_started
      jupyter:
        condition: service_started
      grafana:
        condition: service_started

  # ----------------------------------------------------------------
  # 2. Sistema de Gestión de Contenidos
  # ----------------------------------------------------------------
  joomla:
    image: joomla:latest
    container_name: joomla_cms
    restart: unless-stopped
    environment:
      JOOMLA_DB_HOST: ${JOOMLA_DB_HOST}
      JOOMLA_DB_TYPE: ${JOOMLA_DB_TYPE}
      JOOMLA_DB_NAME: ${JOOMLA_DB_NAME}
      JOOMLA_DB_USER: ${JOOMLA_DB_USER}
      JOOMLA_DB_PASSWORD: ${JOOMLA_DB_PASSWORD}
      JOOMLA_SITE_NAME: ${JOOMLA_SITE_NAME}
      JOOMLA_ADMIN_USER: "Administrador Parcial"
      JOOMLA_ADMIN_USERNAME: admin
      JOOMLA_ADMIN_PASSWORD: AdminParcial123!
      JOOMLA_ADMIN_EMAIL: admin@parcial.local
    volumes:
      - joomla_data:/var/www/html
    networks:
      - frontend_net
      - backend_net
    depends_on:
      database:
        condition: service_healthy

  # ----------------------------------------------------------------
  # 3. Base de datos relacional (obligatoria)
  # ----------------------------------------------------------------
  database:
    image: postgres:16-alpine
    container_name: postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend_net        # sin visibilidad hacia frontend_net ni el host
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ----------------------------------------------------------------
  # 4. Entorno de ciencia de datos
  # ----------------------------------------------------------------
  jupyter:
    build:
      context: ./jupyter
      dockerfile: Dockerfile
    container_name: jupyter_lab
    restart: unless-stopped
    command: ["start-notebook.py", "--ServerApp.base_url=/jupyter/", "--ServerApp.allow_origin=*"]
    environment:
      JUPYTER_TOKEN: ${JUPYTER_TOKEN}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./jupyter/notebooks:/home/jovyan/work
    networks:
      - frontend_net
      - backend_net       # necesita consultar PostgreSQL directamente
    depends_on:
      database:
        condition: service_healthy

  # ----------------------------------------------------------------
  # 5. Plataforma de monitoreo y dashboards
  # ----------------------------------------------------------------
  grafana:
    image: grafana/grafana:latest
    container_name: grafana_dashboards
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: ${GF_SERVER_ROOT_URL}
      GF_SERVER_SERVE_FROM_SUB_PATH: ${GF_SERVER_SERVE_FROM_SUB_PATH}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - frontend_net
      - backend_net       # consulta métricas directas de la BD
    depends_on:
      database:
        condition: service_healthy
