# =========================================================
# Nginx - Edge Router / Reverse Proxy
# Enruta hacia joomla (/), jupyter (/jupyter/) y grafana (/grafana/)
# =========================================================

# ---------------------------------------------------------
# DNS embebido de Docker: los upstream se resuelven en cada
# petición (no sólo al arrancar), así un reinicio de un
# contenedor que cambie de IP no rompe el proxy.
# ---------------------------------------------------------
resolver 127.0.0.11 valid=10s ipv6=off;

# Cabecera Connection correcta para WebSocket (Upgrade) y HTTP normal
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Servicio de destino según el prefijo de la URL (columna del log)
map $uri $servicio {
    ~^/jupyter  jupyter;
    ~^/grafana  grafana;
    default     joomla;
}

# ---------------------------------------------------------
# Log centralizado en CSV (escape=json escapa " y \ con \)
# Lo lee PostgreSQL con file_fdw -> Grafana y Jupyter lo
# consultan por SQL. Columnas:
#   epoch_ms, ip, servicio, metodo, uri, protocolo, status,
#   bytes, request_time, upstream_time, upstream, referer, user_agent
# ---------------------------------------------------------
log_format csv_access escape=json
    '"$msec","$remote_addr","$servicio","$request_method","$request_uri",'
    '"$server_protocol","$status","$body_bytes_sent","$request_time",'
    '"$upstream_response_time","$upstream_addr","$http_referer","$http_user_agent"';

# Formato legible para `docker compose logs nginx`
log_format proxy_access '$remote_addr - $remote_user [$time_local] '
                        '"$request" $status $body_bytes_sent '
                        '"$http_referer" "$http_user_agent" '
                        'svc=$servicio upstream=$upstream_addr rt=$request_time';

access_log /var/log/nginx/access.csv csv_access;
access_log /dev/stdout proxy_access;
error_log  /dev/stderr warn;

server {
    listen 80;
    server_name _;

    client_max_body_size 100M;

    # Cabeceras comunes hacia los backends (Capa 7)
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    # --------------------------------------------------
    # Healthcheck interno (no se registra en el log)
    # --------------------------------------------------
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # --------------------------------------------------
    # Joomla (CMS) - raíz del sitio
    # --------------------------------------------------
    location / {
        set $joomla_upstream joomla:80;
        proxy_pass http://$joomla_upstream;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }

    # --------------------------------------------------
    # Jupyter Lab - requiere soporte WebSocket para el
    # kernel (cabeceras Upgrade / Connection)
    # --------------------------------------------------
    location /jupyter/ {
        set $jupyter_upstream jupyter:8888;
        proxy_pass http://$jupyter_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 86400s;
        proxy_buffering off;
    }

    # --------------------------------------------------
    # Grafana - dashboards (Grafana Live usa WebSocket)
    # --------------------------------------------------
    location /grafana/ {
        set $grafana_upstream grafana:3000;
        proxy_pass http://$grafana_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
    }
}
