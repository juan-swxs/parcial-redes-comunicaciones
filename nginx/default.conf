# =========================================================
# Nginx - Edge Router / Reverse Proxy
# Enruta hacia joomla (/), jupyter (/jupyter/) y grafana (/grafana/)
# =========================================================

# Formato de log centralizado para todas las peticiones (incluye Joomla)
log_format proxy_access '$remote_addr - $remote_user [$time_local] '
                         '"$request" $status $body_bytes_sent '
                         '"$http_referer" "$http_user_agent" '
                         'upstream=$upstream_addr rt=$request_time';

access_log /var/log/nginx/access.log proxy_access;
error_log  /var/log/nginx/error.log warn;

server {
    listen 80;
    server_name _;

    client_max_body_size 100M;

    # --------------------------------------------------
    # Joomla (CMS) - raíz del sitio
    # --------------------------------------------------
    location / {
        proxy_pass http://joomla:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }

    # --------------------------------------------------
    # Jupyter Notebook/Lab - requiere soporte WebSocket
    # para el kernel (Upgrade / Connection headers)
    # --------------------------------------------------
    location /jupyter/ {
        proxy_pass http://jupyter:8888/jupyter/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # --- Soporte WebSocket para el kernel de Jupyter ---
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
    }

    # --------------------------------------------------
    # Grafana - dashboards de monitoreo
    # --------------------------------------------------
    location /grafana/ {
        proxy_pass http://grafana:3000/grafana/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Grafana Live también usa WebSockets
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
